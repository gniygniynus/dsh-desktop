<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>dsh-desktop</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body { display: flex; font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; background: #14161a; color: #e6e6e6; }
    #side { width: 300px; min-width: 300px; display: flex; flex-direction: column; border-right: 1px solid #2a2d34; background: #191c21; }
    #side h1 { font-size: 15px; padding: 14px 14px 8px; color: #9aa4b2; font-weight: 600; letter-spacing: .5px; }
    #side .row { display: flex; gap: 6px; padding: 0 12px 10px; }
    #side button { flex: 1; padding: 7px 4px; font-size: 12px; border-radius: 6px; border: 1px solid #333a45; background: #23272e; color: #d4dce6; cursor: pointer; }
    #side button:hover { background: #2c323c; }
    #side button.primary { background: #2b6cb0; border-color: #2b6cb0; color: #fff; }
    #sessions { flex: 1; overflow: auto; padding: 0 8px 12px; }
    .sess { display: flex; align-items: center; gap: 6px; padding: 8px 8px; border-radius: 6px; cursor: pointer; font-size: 12.5px; border: 1px solid transparent; }
    .sess:hover { background: #22262d; }
    .sess.active { border-color: #2b6cb0; background: #20262f; }
    .sess .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sess .ts { color: #6b7684; font-size: 11px; }
    .empty { color: #5f6b79; font-size: 12px; padding: 10px 8px; }
    #main { flex: 1; position: relative; background: #0d0f12; }
    webview { position: absolute; inset: 0; width: 100%; height: 100%; }
    #overlay { position: absolute; inset: 0; background: rgba(10,12,16,.55); color: #dfe6ef; display: none; align-items: center; justify-content: center; font-size: 16px; letter-spacing: 1px; backdrop-filter: blur(2px); z-index: 10; }
    #overlay.show { display: flex; }
    dialog { background: #1d2026; color: #dbe2ea; border: 1px solid #333a45; border-radius: 10px; padding: 16px; min-width: 420px; max-width: 640px; }
    dialog::backdrop { background: rgba(0,0,0,.5); }
    dialog h3 { font-size: 14px; margin-bottom: 10px; color: #cbd4de; }
    dialog textarea { width: 100%; height: 120px; background: #14171c; color: #dfe6ef; border: 1px solid #333a45; border-radius: 6px; padding: 8px; font-family: monospace; font-size: 12px; resize: vertical; }
    dialog .group { max-height: 240px; overflow: auto; }
    dialog label.opt { display: block; padding: 7px 8px; border-radius: 6px; font-size: 12.5px; cursor: pointer; }
    dialog label.opt:hover { background: #242932; }
    dialog label.opt input { margin-right: 8px; }
    dialog .actions { margin-top: 12px; display: flex; justify-content: flex-end; gap: 8px; }
    dialog .actions button { padding: 6px 14px; border-radius: 6px; border: 1px solid #3a4250; background: #272c34; color: #dfe6ef; cursor: pointer; }
    dialog .actions button.primary { background: #2b6cb0; border-color: #2b6cb0; }
    #msg { position: absolute; bottom: 14px; left: 14px; right: 14px; background: #1d2026cc; border: 1px solid #333a45; border-radius: 8px; padding: 10px 12px; font-size: 13px; display: none; }
  </style>
</head>
<body>
  <aside id="side">
    <h1>dsh-desktop · 会话管理</h1>
    <div class="row">
      <button class="primary" id="btnRollback">撤回</button>
      <button id="btnDelete">删除会话</button>
    </div>
    <div class="row">
      <button id="btnAddProvider">＋ 加供应商</button>
      <button id="btnRefresh">刷新</button>
    </div>
    <div id="sessions"><div class="empty">加载中…</div></div>
  </aside>

  <main id="main">
    <webview id="harness" disablewebsecurity></webview>
    <div id="overlay">处理中…</div>
    <div id="msg"></div>
  </main>

  <dialog id="dlgProvider">
    <h3>粘贴 CCSwitch 账号（自动识别）</h3>
    <textarea id="providerText" placeholder="从 CC Switch 复制账号配置（JSON / KEY=VALUE）粘贴到这里…"></textarea>
    <div style="margin-top:8px;font-size:12px;color:#8b96a5">
      <label style="cursor:pointer"><input type="checkbox" id="providerAuto" checked /> 自动从 /v1/models 发现模型（推荐）</label>
    </div>
    <div class="actions">
      <button id="btnProviderCancel">取消</button>
      <button id="btnProviderOk" class="primary">解析并添加</button>
    </div>
  </dialog>

  <dialog id="dlgTurns">
    <h3>选择撤回点（最近对话，删掉所选之后的一切）</h3>
    <div class="group" id="turnsList"></div>
    <div class="actions">
      <button id="btnTurnsCancel">取消</button>
      <button id="btnTurnsOk" class="primary">撤回</button>
    </div>
  </dialog>

  <script type="module" src="./renderer.js"></script>
</body>
</html>
